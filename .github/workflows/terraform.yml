name: 'Terraform'

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:

  # PLAN

  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

   
      # Q14 - Publication de l'image dans ACR
   

      - name: Login to Azure Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            "${{ secrets.ACR_LOGIN_SERVER }}" \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Pull Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker pull mcr.microsoft.com/azuredocs/aci-helloworld

      - name: Tag Docker image for ACR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag \
            mcr.microsoft.com/azuredocs/aci-helloworld \
            "${{ secrets.ACR_LOGIN_SERVER }}/cr460-app:v1"

      - name: Push Docker image to ACR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push \
            "${{ secrets.ACR_LOGIN_SERVER }}/cr460-app:v1"

    
      # Q15 - Terraform Plan

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan -input=false
          exitcode=$?
          set -e

          if [ "$exitcode" -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          elif [ "$exitcode" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Terraform detected changes."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform changes detected."
          fi

      - name: Upload Terraform Plan
        if: |
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
      
 
  # Q15 - APPROBATION MANUELLE + APPLY

  apply:
    name: 'Terraform Apply'
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # GitHub bloque le job ici jusqu'à l'approbation
    environment:
      name: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Terraform Init
        run: terraform init
      - name: No changes to apply
        if: needs.plan.outputs.has_changes != 'true'
        run: |
          echo "Terraform Plan contains no infrastructure changes."
          echo "Manual approval completed; Terraform Apply is not required."

      - name: Download Terraform Plan
        if: needs.plan.outputs.has_changes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Terraform Apply
        if: needs.plan.outputs.has_changes == 'true'
        run: terraform apply -input=false tfplan